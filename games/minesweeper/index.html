<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雷区漫步</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1220; }
    body { font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; color: #eef2fb; }
    canvas { display: block; }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: rgba(13, 18, 32, 0.82); z-index: 10; overflow-y: auto;
    }
    #overlay.hidden { display: none; }
    .panel {
      width: 100%; max-width: 560px; background: #18213a; border: 1px solid #2a3658;
      border-radius: 20px; padding: 28px;
    }
    h1 { margin: 0 0 4px; font-size: 34px; }
    .sub { margin: 0 0 18px; color: #9aa6c2; }
    ol { margin: 0 0 20px; padding-left: 22px; line-height: 1.75; }
    .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
    button {
      font: inherit; font-size: 18px; font-weight: 700; border: 0; border-radius: 12px;
      padding: 14px 22px; cursor: pointer; color: #0d1220; background: #5cffb0;
    }
    button.secondary { background: #2a3658; color: #eef2fb; }
    button[hidden] { display: none; }
    .note { font-size: 14px; color: #9aa6c2; margin: 0; }
    a { color: #f5b941; }
    #back { position: fixed; top: 12px; left: 12px; z-index: 5; font-size: 15px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <a id="back" href="../../">← 返回大厅</a>
  <div id="overlay">
    <div class="panel">
      <h1>雷区漫步</h1>
      <p class="sub">雷区铺在你家地板上。走过去，踩一格翻一格。</p>
      <ol>
        <li>场地会自动铺满你的<b>安全边界</b>；也可以在面板上选<b>自己画</b>：用射线指着地面按扳机放点，绕一圈回到绿点，围出任意形状。</li>
        <li>场地被切成大小不一的<b>石板</b>，每局形状都不同。</li>
        <li>先随便走两步，然后在一块石板上<b>站稳约 0.7 秒</b>，它就会翻开。</li>
        <li>数字表示和这块石板<b>相邻</b>（共用一条边）的石板里有几颗雷。</li>
        <li>觉得哪块有雷？用射线指着它<b>按扳机插旗</b>，插了旗的石板踩上去不会翻开。</li>
        <li>按 <b>A / X</b> 重新开始（会换一套新形状）。</li>
      </ol>
      <div class="buttons">
        <button id="enter-vr" hidden>进入 VR</button>
        <button id="enter-ar" hidden>进入混合现实</button>
        <button id="desktop" class="secondary">在电脑上预览</button>
      </div>
      <p class="note" id="note">开始前请先设置好安全边界，清出大约 2×2 米的空地。</p>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
